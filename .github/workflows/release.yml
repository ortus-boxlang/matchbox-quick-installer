name: MVM Release

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SNAPSHOT: ${{ github.ref == 'refs/heads/development' }}

permissions:
  contents: read

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up BoxLang and CommandBox
        uses: ortus-boxlang/setup-boxlang@main
        with:
          with-commandbox: true

      - name: Set up MatchBox
        uses: ortus-boxlang/setup-matchbox@main
        with:
          version: latest

      - name: Install TestBox
        run: box install

      - name: Run integration tests
        run: ./tests/integration/run.sh

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
          - runner: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MatchBox
        uses: ortus-boxlang/setup-matchbox@main
        with:
          version: latest

      - name: Build MVM
        shell: bash
        env:
          MVM_PLATFORM: ${{ matrix.platform }}
        run: |
          MATCHBOX_BIN=matchbox
          MVM_EXE=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              MATCHBOX_BIN=matchbox.exe
              MVM_EXE=.exe
          fi
          mkdir -p build release-assets
          MVM_VERSION="$(grep -m1 '"version"' box.json | cut -d '"' -f 4)"
          if [[ "$SNAPSHOT" == "true" ]]; then MVM_VERSION="${MVM_VERSION}-snapshot"; fi
          sed "s/^MVM_VERSION = .*/MVM_VERSION = \"$MVM_VERSION\";/" src/mvm.bxs > build/mvm.bxs
          "$MATCHBOX_BIN" --target native --output "build/mvm-$MVM_PLATFORM$MVM_EXE" build/mvm.bxs
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "build/mvm-$MVM_PLATFORM"; fi
          cp "build/mvm-$MVM_PLATFORM$MVM_EXE" "release-assets/mvm-$MVM_PLATFORM$MVM_EXE"
          "release-assets/mvm-$MVM_PLATFORM$MVM_EXE" version

      - uses: actions/upload-artifact@v4
        with:
          name: mvm-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release or snapshot
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read MVM version
        id: version
        run: echo "version=$(grep -m1 '"version"' box.json | cut -d '"' -f 4)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: mvm-*
          path: release-assets
          merge-multiple: true

      - name: Update snapshot tag
        if: env.SNAPSHOT == 'true'
        uses: rickstaa/action-create-tag@v1.7.2
        with:
          tag: snapshot
          force_push_tag: true
          message: MVM development snapshot

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SNAPSHOT == 'true' && 'snapshot' || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.SNAPSHOT == 'true' && 'MVM Snapshot' || format('MVM {0}', steps.version.outputs.version) }}
          body: ${{ env.SNAPSHOT == 'true' && format('Development snapshot from {0}', github.sha) || '' }}
          prerelease: ${{ env.SNAPSHOT == 'true' }}
          make_latest: ${{ env.SNAPSHOT == 'true' && 'false' || 'true' }}
          overwrite_files: true
          generate_release_notes: ${{ env.SNAPSHOT == 'false' }}
          files: release-assets/*
