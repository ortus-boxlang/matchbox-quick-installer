name: MVM Release

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SNAPSHOT: ${{ github.ref == 'refs/heads/development' }}

permissions:
  contents: read

jobs:
  test-platform:
    name: Integration tests (${{ matrix.platform }})
    # A development push already runs the full release pipeline for this commit.
    if: github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.base.ref != 'main' || github.event.pull_request.head.ref != 'development' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        # Windows arm64 is still built in the build job, but CommandBox cannot run there yet.
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # TestBox 6.5 treats its runner script as a bundle on BoxLang 1.17.5.
      # Unpin after its CLI runner filters the script path.
      - name: Set up BoxLang and CommandBox
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: 1.16.0
          with-commandbox: true

      - name: Set up MatchBox
        uses: ortus-boxlang/setup-matchbox@main
        with:
          version: latest

      - name: Install TestBox
        run: box install

      - name: Run integration tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tests/integration/run.sh

      - name: Run Windows installer suite
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\powershell\run.ps1

  test-linux-distro:
    name: Installer smoke (${{ matrix.distro }})
    if: github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.base.ref != 'main' || github.event.pull_request.head.ref != 'development' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MVM's native binary is glibc-linked, so the smoke suite targets glibc distros.
        distro: [debian, ubuntu, fedora, arch]
    steps:
      - uses: actions/checkout@v4

      - name: Run Linux distro tests
        id: run-linux
        continue-on-error: true
        shell: sh
        run: |
          log_directory="$RUNNER_TEMP/mvm-test-logs"
          mkdir -p "$log_directory"
          log_path="$log_directory/linux-${{ matrix.distro }}.log"
          set +e
          (
            sh ./tests/run-all.sh ${{ matrix.distro }}
            printf '%s\n' "$?" >"$log_path.exitcode"
          ) 2>&1 | tee "$log_path"

      - name: Report Linux distro results
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "mvm-test-logs/linux-${{ matrix.distro }}.log"
          $exitCode = [int](Get-Content "$logPath.exitcode")
          & ./tests/ci-report.ps1 -Name 'Installer smoke (${{ matrix.distro }})' -LogPath $logPath -ExitCode $exitCode

      - name: Upload Linux distro log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-linux-${{ matrix.distro }}
          path: ${{ runner.temp }}/mvm-test-logs/linux-${{ matrix.distro }}.log

      - name: Finalize Linux distro results
        if: always()
        shell: sh
        run: exit "$(cat "$RUNNER_TEMP/mvm-test-logs/linux-${{ matrix.distro }}.log.exitcode")"

  build:
    name: Build ${{ matrix.platform }}
    needs: [test-platform, test-linux-distro]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
          - runner: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MatchBox
        uses: ortus-boxlang/setup-matchbox@main
        with:
          version: latest

      - name: Build MVM
        shell: bash
        env:
          MVM_PLATFORM: ${{ matrix.platform }}
        run: |
          VERSION="$(grep -m1 '"version"' box.json | cut -d '"' -f 4)"
          VERSION="${VERSION%-snapshot}"
          if [[ "$SNAPSHOT" == "true" ]]; then MVM_VERSION="${VERSION}-snapshot"; else MVM_VERSION="$VERSION"; fi
          MATCHBOX_BIN=matchbox
          MVM_EXE=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              MATCHBOX_BIN=matchbox.exe
              MVM_EXE=.exe
          fi
          mkdir -p release-assets
          MVM_OUTPUT="build/mvm-$MVM_PLATFORM$MVM_EXE" \
          MVM_VERSION="$MVM_VERSION" \
          MVM_COMMIT="$GITHUB_SHA" \
          MVM_BUILT_ON="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          MATCHBOX_BIN="$MATCHBOX_BIN" \
          ./build.sh
          cp "build/mvm-$MVM_PLATFORM$MVM_EXE" "release-assets/mvm-$MVM_PLATFORM$MVM_EXE"
          "release-assets/mvm-$MVM_PLATFORM$MVM_EXE" version

      - uses: actions/upload-artifact@v4
        with:
          name: mvm-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release or snapshot
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    needs: [test-platform, test-linux-distro, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read MVM version
        id: version
        run: |
          version="$(grep -m1 '"version"' box.json | cut -d '"' -f 4)"
          version="${version%-snapshot}"
          if [[ "$SNAPSHOT" == "true" ]]; then version="${version}-snapshot"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: mvm-*
          path: release-assets
          merge-multiple: true

      - name: Update snapshot version tag
        if: env.SNAPSHOT == 'true'
        uses: rickstaa/action-create-tag@v1.7.2
        with:
          tag: ${{ format('v{0}', steps.version.outputs.version) }}
          force_push_tag: true
          message: MVM development snapshot

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: ${{ format('MVM v{0}', steps.version.outputs.version) }}
          body: "${{ env.SNAPSHOT == 'true' && format('Commit: {0}', github.sha) || '' }}"
          prerelease: ${{ env.SNAPSHOT == 'true' }}
          make_latest: ${{ env.SNAPSHOT == 'true' && 'false' || 'true' }}
          overwrite_files: true
          generate_release_notes: ${{ env.SNAPSHOT == 'false' }}
          files: release-assets/*
