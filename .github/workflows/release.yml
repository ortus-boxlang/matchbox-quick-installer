name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
          - runner: windows-latest
            platform: windows-x64
          - runner: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MatchBox
        uses: ortus-boxlang/setup-matchbox@main
        with:
          version: latest

      - name: Build MVM
        shell: bash
        env:
          MVM_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          MATCHBOX_BIN=matchbox
          MVM_EXE=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              MATCHBOX_BIN=matchbox.exe
              MVM_EXE=.exe
          fi
          mkdir -p build release-assets
          MVM_VERSION="${RELEASE_TAG#v}"
          sed "s/^MVM_VERSION = .*/MVM_VERSION = \"$MVM_VERSION\";/" src/mvm.bxs > build/mvm.bxs
          "$MATCHBOX_BIN" --target native --output "build/mvm-$MVM_PLATFORM$MVM_EXE" build/mvm.bxs
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "build/mvm-$MVM_PLATFORM"; fi
          cp "build/mvm-$MVM_PLATFORM$MVM_EXE" "release-assets/mvm-$MVM_PLATFORM$MVM_EXE"
          "release-assets/mvm-$MVM_PLATFORM$MVM_EXE" version

      - uses: actions/upload-artifact@v4
        with:
          name: mvm-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mvm-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
