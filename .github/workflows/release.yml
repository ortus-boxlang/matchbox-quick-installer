name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x64
            matchbox: matchbox-linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            matchbox: matchbox-linux-arm64
          - runner: macos-13
            platform: macos-x64
            matchbox: matchbox-macos-x64
          - runner: macos-latest
            platform: macos-arm64
            matchbox: matchbox-macos-arm64
          - runner: windows-latest
            platform: windows-x64
            matchbox: matchbox-windows-x64.exe
          - runner: windows-11-arm
            platform: windows-arm64
            matchbox: matchbox-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download MatchBox compiler and build MVM
        shell: bash
        env:
          MATCHBOX_ASSET: ${{ matrix.matchbox }}
          MVM_PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          MATCHBOX_TAG="$(curl -fsSL https://api.github.com/repos/ortus-boxlang/matchbox/releases/latest | grep -m1 '"tag_name"' | cut -d '"' -f 4)"
          MATCHBOX_BIN=matchbox
          MVM_EXE=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              MATCHBOX_BIN=matchbox.exe
              MVM_EXE=.exe
          fi
          curl -fL "https://github.com/ortus-boxlang/matchbox/releases/download/$MATCHBOX_TAG/$MATCHBOX_ASSET" -o "$MATCHBOX_BIN"
          chmod +x "$MATCHBOX_BIN" 2>/dev/null || true
          mkdir -p build release-assets
          MVM_VERSION="${RELEASE_TAG#v}"
          sed "s/^MVM_VERSION = .*/MVM_VERSION = \"$MVM_VERSION\";/" src/mvm.bxs > build/mvm.bxs
          ./$MATCHBOX_BIN --target native --output "build/mvm-$MVM_PLATFORM$MVM_EXE" build/mvm.bxs
          if [[ "$RUNNER_OS" != "Windows" ]]; then chmod +x "build/mvm-$MVM_PLATFORM"; fi
          cp "build/mvm-$MVM_PLATFORM$MVM_EXE" "release-assets/mvm-$MVM_PLATFORM$MVM_EXE"
          "release-assets/mvm-$MVM_PLATFORM$MVM_EXE" version

      - uses: actions/upload-artifact@v4
        with:
          name: mvm-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mvm-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
